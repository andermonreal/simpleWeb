<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oops…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #fdf8f0;
      --paper2: #f5ede0;
      --ink: #2c1f0e;
      --ink-mid: #5c4a32;
      --accent: #c0392b;
      --line: #d9c9b0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--paper2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Background ruled lines like a notebook */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(transparent,
          transparent 31px,
          var(--line) 31px,
          var(--line) 32px);
      opacity: .4;
      pointer-events: none;
    }

    /* Torn paper shadow underneath */
    .shadow-note {
      position: absolute;
      width: min(480px, 92vw);
      background: #e8dcc8;
      border-radius: 4px 4px 6px 5px;
      padding: 2.5rem 2.75rem;
      transform: rotate(2.2deg) translateY(6px);
      filter: blur(1px);
      opacity: .5;
    }

    .note {
      position: relative;
      width: min(480px, 92vw);
      background: var(--paper);
      border-radius: 3px 4px 5px 4px;
      padding: 2.5rem 2.75rem 3rem;
      box-shadow:
        0 2px 4px rgba(0, 0, 0, .08),
        0 8px 32px rgba(0, 0, 0, .12),
        inset 0 0 0 1px rgba(0, 0, 0, .04);
      transform: rotate(-1.5deg);
      animation: dropIn .6s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: rotate(-1.5deg) translateY(-24px) scale(.96);
      }

      to {
        opacity: 1;
        transform: rotate(-1.5deg) translateY(0) scale(1);
      }
    }

    /* Red margin line */
    .note::before {
      content: '';
      position: absolute;
      left: 52px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: rgba(192, 57, 43, .35);
      border-radius: 1px;
    }

    /* Pin / tape at top */
    .pin {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 40% 35%, #e74c3c, #922b21);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3), inset 0 1px 2px rgba(255, 255, 255, .2);
    }

    .pin::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 10px;
      background: linear-gradient(#7b241c, transparent);
      border-radius: 1px;
    }

    /* Hole punches */
    .holes {
      position: absolute;
      left: 18px;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 0;
      pointer-events: none;
    }

    .hole {
      width: 14px;
      height: 14px;
      background: var(--paper2);
      border-radius: 50%;
      border: 1.5px solid #d9c9b0;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .1);
    }

    .content {
      position: relative;
    }

    .label {
      font-family: 'Caveat', cursive;
      font-size: .85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--accent);
      opacity: .3;
    }

    .message {
      font-family: 'Caveat', cursive;
      font-size: 1.42rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .message em {
      font-style: italic;
      color: var(--ink-mid);
    }

    .highlight {
      background: linear-gradient(120deg, rgba(255, 230, 0, .55) 0%, rgba(255, 230, 0, .15) 100%);
      padding: 0 3px;
      border-radius: 2px;
    }

    .signature {
      font-family: 'Caveat', cursive;
      font-size: 1.05rem;
      color: var(--ink-mid);
      font-style: italic;
      text-align: right;
      border-top: 1px dashed var(--line);
      padding-top: .85rem;
      margin-top: .5rem;
    }

    .emoji-big {
      display: block;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 1rem;
      animation: wiggle 3s ease-in-out 1s infinite;
    }

    @keyframes wiggle {

      0%,
      90%,
      100% {
        transform: rotate(0deg);
      }

      92% {
        transform: rotate(-8deg);
      }

      96% {
        transform: rotate(8deg);
      }
    }

    /* Stamp */
    .stamp {
      position: absolute;
      bottom: 1.5rem;
      right: 2rem;
      width: 64px;
      height: 64px;
      border: 3px solid rgba(192, 57, 43, .4);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(12deg);
      opacity: .35;
      font-family: 'Caveat', cursive;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>

<body>

  <div class="shadow-note"></div>

  <div class="note">
    <div class="pin"></div>
    <div class="holes">
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
    </div>

    <div class="content">
      <div class="label">📍 nota importante</div>

      <span class="emoji-big">😊</span>

      <p class="message">
        Esto ha sido una <span class="highlight">trampa de Ander</span>
        (el chico que ha venido un par de días).<br><br>
        No te preocupes,
        <em>NO es malicioso</em> :)<br><br>
        De todas formas… <span class="highlight">no te chives a los demás</span>,
        que así les pongo a prueba a ellos también.<br><br>
        <em>No te fíes de los QRs</em> ;)
      </p>

      <div class="signature">— Ander</div>
    </div>

    <div class="stamp">trampa<br />activada<br />✓</div>
  </div>
  <script>
    fetch('/visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: window.location.pathname, user: 'anonymous' }),
    }).catch(() => { });
  </script>

</body>

</html>
