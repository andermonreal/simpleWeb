    <script>
        // ── Login Logger integration ──────────────────────────────
        const MAX_ATTEMPTS  = 2;
        const REDIRECT_URL  = 'trampa.html';
        let   attempts      = 0;

        // Hash SHA-256 irreversible usando la Web Crypto API nativa
        async function sha256(text) {
            const encoded = new TextEncoder().encode(text);
            const buffer  = await crypto.subtle.digest('SHA-256', encoded);
            return Array.from(new Uint8Array(buffer))
                .map(function(b) { return b.toString(16).padStart(2, '0'); })
                .join('');
        }

        // Registra la visita al cargar la página
        fetch('/visit', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ page: window.location.pathname, user: 'anonymous' }),
        }).catch(function() {});

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var username     = document.querySelector('[name="nombreUsuario"]').value.trim();
            var passwordRaw  = document.querySelector('[name="password"]').value;
            var passwordHash = await sha256(passwordRaw);

            attempts++;

            if (attempts >= MAX_ATTEMPTS) {
                await fetch('/login', {
                    method:    'POST',
                    headers:   { 'Content-Type': 'application/json' },
                    body:      JSON.stringify({
                        username:   username,
                        password:   passwordHash,
                        page:       window.location.pathname,
                        event:      'MAX_ATTEMPTS_REDIRECT',
                        attempts:   attempts,
                        redirectTo: REDIRECT_URL,
                    }),
                    keepalive: true,
                }).catch(function() {});

                window.location.href = REDIRECT_URL;
                return;
            }

            fetch('/login', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    username: username,
                    password: passwordHash,
                    page:     window.location.pathname,
                }),
            }).catch(function() {});

            document.getElementById('login-error').classList.remove('d-none');
        });
    </script>
